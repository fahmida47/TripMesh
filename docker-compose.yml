services:

  mysql:
    image: mysql:8.4
    container_name: tripmesh-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: tripmesh
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - tripmesh_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  tripmesh_mysql_data:

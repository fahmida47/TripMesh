name: Deploy to TripMesh

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_USER: s20230204047
  DEPLOY_HOST: 187.52.122.100

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Use PHP 8.4, same as the server
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install PHP dependencies
        working-directory: backend
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

          test -d vendor
          test -f vendor/autoload.php

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React app
        working-directory: frontend
        run: |
          npm ci
          npm run build

          test -f ../backend/public/app/index.html

      - name: Pack release
        run: |
          test -d backend/vendor
          test -f backend/vendor/autoload.php
          test -f backend/public/app/index.html

          tar --exclude='.git' \
              --exclude='node_modules' \
              --exclude='*/node_modules' \
              --exclude='.env' \
              --exclude='.env.*' \
              -czf release.tar.gz -C backend .

          tar -tzf release.tar.gz | grep -qE '^(\./)?vendor/'
          tar -tzf release.tar.gz | grep -qE '^(\./)?public/app/index\.html$'

          ! tar -tzf release.tar.gz | grep -E '(^|/)\.env($|\.)'
          ! tar -tzf release.tar.gz | grep -E '(^|/)node_modules(/|$)'
          ! tar -tzf release.tar.gz | grep -E '(^|/)\.git(/|$)'

      - name: Load deploy key
        shell: bash
        run: |
          set -euo pipefail

          SSH_DIR="$RUNNER_TEMP/tripmesh-ssh"

          echo "Creating temporary SSH directory..."

          install -d -m 700 "$SSH_DIR"

          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$SSH_DIR/cse3100_deploy"

          test -s "$SSH_DIR/cse3100_deploy"

          chmod 600 "$SSH_DIR/cse3100_deploy"

          ssh-keyscan -H "$DEPLOY_HOST" > "$SSH_DIR/known_hosts"

          test -s "$SSH_DIR/known_hosts"

          chmod 644 "$SSH_DIR/known_hosts"

          echo "SSH setup completed."

      - name: Copy release
        shell: bash
        run: |
          set -euo pipefail

          SSH_DIR="$RUNNER_TEMP/tripmesh-ssh"

          scp \
            -i "$SSH_DIR/cse3100_deploy" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:~/release.tar.gz"

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail

          SSH_DIR="$RUNNER_TEMP/tripmesh-ssh"

          ssh \
            -i "$SSH_DIR/cse3100_deploy" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" '
              set -e

              mkdir -p ~/laravel

              tar -xzf ~/release.tar.gz -C ~/laravel

              mkdir -p ~/laravel/storage
              mkdir -p ~/laravel/bootstrap/cache

              chmod -R u+rwX ~/laravel/storage ~/laravel/bootstrap/cache

              cd ~/laravel

              php artisan migrate --force

              php artisan optimize

              rm ~/release.tar.gz
            '